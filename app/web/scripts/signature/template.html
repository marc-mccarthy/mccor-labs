<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="540"
  bgcolor="{{plate}}"
  style="width:540px;max-width:540px;border-collapse:separate;border:1px solid {{edge}};border-radius:8px;background-color:{{plate}};font-family:{{font}};"
>
  <tr>
    <td width="240" style="width: 240px; padding: 0; vertical-align: top; line-height: 0">
      <img
        src="{{assetBase}}/scene.gif"
        width="240"
        height="170"
        alt="McCor Labs"
        style="display:block;width:240px;height:170px;border:0;border-radius:8px 0 0 8px;font-family:{{font}};font-size:12px;color:{{ink}};"
      />
    </td>
    <td bgcolor="{{plate}}" style="padding: 12px 16px 12px 16px; vertical-align: middle">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="padding: 0 12px 0 0; line-height: 0; vertical-align: middle">
            <img
              src="{{assetBase}}/photo-{{slug}}.png"
              width="56"
              height="56"
              alt=""
              style="display: block; width: 56px; height: 56px; border: 0"
            />
          </td>
          <td style="vertical-align: middle">
            <div
              style="font-family:{{font}};font-size:18px;line-height:22px;font-weight:700;color:{{text}};mso-line-height-rule:exactly;"
            >
              {{name}}
            </div>
            <div
              style="font-family:{{font}};font-size:12px;line-height:16px;font-weight:700;color:{{ink}};mso-line-height-rule:exactly;"
            >
              {{roleLine}}
            </div>
            {{specialtyLine}}
          </td>
        </tr>
        <tr>
          <td
            colspan="2"
            style="padding:6px 0 0 0;font-family:{{font}};font-size:12px;line-height:18px;color:{{ink}};white-space:nowrap;mso-line-height-rule:exactly;"
          >
            {{phoneCell}}<a
              href="mailto:{{email}}"
              style="color:{{ink}};text-decoration:none;"
              >{{email}}</a
            >&nbsp;&middot;&nbsp;<a
              href="{{siteUrl}}"
              style="color:{{ink}};text-decoration:none;"
              >mccorlabs.com</a
            >
          </td>
        </tr>
        <tr>
          <td colspan="2" style="padding: 2px 0 0 0">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td
                  style="padding:0 4px 0 0;font-family:{{font}};font-size:13px;line-height:20px;font-weight:700;vertical-align:middle;"
                >
                  <a href="{{contactUrl}}" style="color:{{link}};text-decoration:none;"
                    >Book a call &rarr;</a
                  >
                </td>
                {{socialCells}}
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
