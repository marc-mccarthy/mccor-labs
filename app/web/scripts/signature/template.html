<table
  id="sig"
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="546"
  style="width:546px;border-collapse:collapse;background:{{base}}"
>
  <tr>
    <td
      width="26"
      height="26"
      style="width: 26px; height: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-tl.gif"
        width="26"
        height="26"
        alt=""
        style="display: block; border: 0; width: 26px; height: 26px"
      />
    </td>
    <td
      width="496"
      height="26"
      style="width: 496px; height: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-top.gif"
        width="496"
        height="26"
        alt=""
        style="display: block; border: 0; width: 496px; height: 26px"
      />
    </td>
    <td
      width="24"
      height="26"
      style="width: 24px; height: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-tr.gif"
        width="24"
        height="26"
        alt=""
        style="display: block; border: 0; width: 24px; height: 26px"
      />
    </td>
  </tr>
  <tr>
    <td
      width="26"
      valign="top"
      style="width: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-left.gif"
        width="26"
        height="139"
        alt=""
        style="display: block; border: 0; width: 26px; height: 139px"
      />
    </td>
    <td width="496" valign="top" style="width: 496px; padding: 0">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="496"
        style="width: 496px; border-collapse: collapse"
      >
        <tr>
          <td
            width="349"
            height="139"
            valign="middle"
            style="width:349px;height:139px;background:{{text}};padding:0 12px 0 9px"
          >
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
              width="349"
              style="width: 349px"
            >
              <tr>
                {{photoCell}}
                <td
                  valign="middle"
                  style="padding:{{padTop}}px 0 {{padBottom}}px 19px;font-family:{{font}}"
                >
                  <div
                    style="font-size:21px;line-height:20px;font-weight:800;color:{{base}};letter-spacing:-0.4px;white-space:nowrap"
                  >
                    {{name}}
                  </div>
                  <div
                    style="font-size:9px;line-height:12px;letter-spacing:0.5px;color:{{crimson}};text-transform:uppercase;font-weight:700;padding-top:2px"
                  >
                    {{roleLine}}
                  </div>
                  {{specialtyRow}}
                  <div
                    style="border-top:1px solid {{rule}};font-size:1px;line-height:1px;height:1px;margin-top:5px"
                  >
                    &nbsp;
                  </div>
                  <div
                    style="font-size:11px;line-height:14px;color:{{crimson}};padding-top:4px"
                  >
                    <a
                      href="mailto:{{email}}"
                      style="color:{{crimson}};text-decoration:none;font-weight:700"
                      >{{email}}</a
                    >
                  </div>
                  {{contactBlock}}
                </td>
              </tr>
            </table>
          </td>
          <td
            width="126"
            height="135"
            align="right"
            valign="middle"
            style="width:126px;height:135px;background:{{base}};padding:0 0 4px 0;line-height:0"
          >
            <img
              src="{{assetBase}}/crest.gif"
              width="118"
              height="131"
              alt="McCarthy coat of arms"
              style="
                display: block;
                border: 0;
                width: 118px;
                height: 131px;
                margin: 0 0 0 auto;
              "
            />
          </td>
        </tr>
      </table>
    </td>
    <td
      width="24"
      valign="top"
      style="width: 24px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-right.gif"
        width="24"
        height="139"
        alt=""
        style="display: block; border: 0; width: 24px; height: 139px"
      />
    </td>
  </tr>
  <tr>
    <td
      width="26"
      height="25"
      style="width: 26px; height: 25px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-bl.gif"
        width="26"
        height="25"
        alt=""
        style="display: block; border: 0; width: 26px; height: 25px"
      />
    </td>
    <td
      width="496"
      height="25"
      style="width: 496px; height: 25px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-bottom.gif"
        width="496"
        height="25"
        alt=""
        style="display: block; border: 0; width: 496px; height: 25px"
      />
    </td>
    <td
      width="24"
      height="25"
      style="width: 24px; height: 25px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-br.gif"
        width="24"
        height="25"
        alt=""
        style="display: block; border: 0; width: 24px; height: 25px"
      />
    </td>
  </tr>
</table>
