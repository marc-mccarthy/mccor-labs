<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="620" style="width:620px;max-width:620px;border-collapse:collapse;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td width="260" style="width:260px;padding:0;vertical-align:middle;line-height:0;">
      <img src="{{assetBase}}/scene.gif" width="260" height="147" alt="McCor Labs red stag among glowing pines" style="display:block;width:260px;height:147px;border:0;">
    </td>
    <td width="96" style="width:96px;padding:0 14px 0 0;vertical-align:middle;line-height:0;">
      <img src="{{assetBase}}/photo-{{slug}}.png" width="96" height="120" alt="{{name}}" style="display:block;width:96px;height:120px;border:0;">
    </td>
    <td style="padding:6px 0 6px 0;vertical-align:middle;">
      <img src="{{assetBase}}/name-{{slug}}.png" width="200" height="36" alt="{{name}}" style="display:block;width:200px;height:36px;border:0;margin:0 0 2px -5px;">
      <div style="font-size:12px;line-height:16px;color:{{ink}};font-weight:600;">{{title}}</div>
      <div style="font-size:12px;line-height:18px;color:{{ink}};white-space:nowrap;">{{phoneCell}}<a href="mailto:{{email}}" style="color:{{ink}};text-decoration:none;">{{email}}</a></div>
      <div style="font-size:12px;line-height:18px;color:{{ink}};"><a href="{{siteUrl}}" style="color:{{link}};text-decoration:none;font-weight:600;">mccorlabs.com</a>&nbsp;&middot;&nbsp;<a href="{{bookingUrl}}" style="color:{{link}};text-decoration:none;font-weight:600;">Book a call</a>{{socialCells}}</div>
    </td>
  </tr>
</table>
