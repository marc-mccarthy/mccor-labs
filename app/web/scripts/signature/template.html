<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="440" style="width:440px;max-width:440px;border-collapse:collapse;background-color:{{base}};border:2px solid {{border}};font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td colspan="2" style="padding:0;line-height:0;">
      <img src="{{assetBase}}/scene.gif" width="436" height="227" alt="McCor Labs red stag among glowing pines" style="display:block;width:436px;height:227px;border:0;">
    </td>
  </tr>
  <tr>
    <td colspan="2" align="center" style="padding:0 12px 6px 12px;text-align:center;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="border-collapse:collapse;margin:0 auto;">
        <tr>
          <td width="76" style="width:76px;padding:0 12px 0 0;vertical-align:middle;line-height:0;">
            <img src="{{assetBase}}/photo-{{slug}}.jpg" width="76" height="95" alt="{{name}}" style="display:block;width:76px;height:95px;border:0;">
          </td>
          <td style="padding:0;vertical-align:middle;text-align:left;">
            <img src="{{assetBase}}/name-{{slug}}.png" width="190" height="34" alt="{{name}}" style="display:block;width:190px;height:34px;border:0;margin:0 0 1px -5px;">
            <div style="font-size:11px;line-height:15px;color:{{text}};font-weight:600;">{{title}}</div>
            <div style="font-size:11px;line-height:16px;">{{phoneCell}}<a href="mailto:{{email}}" style="color:{{muted}};text-decoration:none;">{{email}}</a></div>
            <div style="font-size:11px;line-height:16px;color:{{muted}};"><a href="{{siteUrl}}" style="color:{{link}};text-decoration:none;font-weight:600;">mccorlabs.com</a>&nbsp;&middot;&nbsp;<a href="{{bookingUrl}}" style="color:{{link}};text-decoration:none;font-weight:600;">Book a call</a></div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:6px;">
              <tr>
                {{socialCells}}
                <td style="padding:0;vertical-align:middle;font-size:8px;line-height:12px;color:{{borderStrong}};letter-spacing:0.5px;text-transform:uppercase;">{{slogan}}</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
