<table
  id="sig"
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="600"
  style="width:600px;border-collapse:collapse;background:{{base}}"
>
  <tr>
    <td
      width="26"
      height="26"
      style="width: 26px; height: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-tl.gif"
        width="26"
        height="26"
        alt=""
        style="display: block; border: 0; width: 26px; height: 26px"
      />
    </td>
    <td
      width="548"
      height="26"
      style="width: 548px; height: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-top.gif"
        width="548"
        height="26"
        alt=""
        style="display: block; border: 0; width: 548px; height: 26px"
      />
    </td>
    <td
      width="26"
      height="26"
      style="width: 26px; height: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-tr.gif"
        width="26"
        height="26"
        alt=""
        style="display: block; border: 0; width: 26px; height: 26px"
      />
    </td>
  </tr>
  <tr>
    <td
      width="26"
      valign="top"
      style="width: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-left.gif"
        width="26"
        height="149"
        alt=""
        style="display: block; border: 0; width: 26px; height: 149px"
      />
    </td>
    <td width="548" valign="top" style="width: 548px; padding: 0">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="548"
        style="width: 548px; border-collapse: collapse"
      >
        <tr>
          <td
            width="349"
            height="149"
            valign="middle"
            style="width:349px;height:149px;background:{{text}};padding:0 12px 0 9px"
          >
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
              width="349"
              style="width: 349px"
            >
              <tr>
                {{photoCell}}
                <td
                  valign="middle"
                  style="padding:{{padTop}}px 0 {{padBottom}}px 19px;font-family:{{font}}"
                >
                  <div
                    style="font-size:21px;line-height:23px;font-weight:800;color:{{base}};letter-spacing:-0.4px;white-space:nowrap"
                  >
                    {{name}}
                  </div>
                  <div
                    style="font-size:9px;line-height:12px;letter-spacing:0.5px;color:{{crimson}};text-transform:uppercase;font-weight:700;padding-top:3px;white-space:nowrap"
                  >
                    {{roleLine}}
                  </div>
                  {{specialtyRow}}
                  <div
                    style="border-top:1px solid {{rule}};font-size:1px;line-height:1px;height:1px;margin-top:6px"
                  >
                    &nbsp;
                  </div>
                  <div
                    style="font-size:11px;line-height:15px;color:{{crimson}};padding-top:5px"
                  >
                    <a
                      href="mailto:{{email}}"
                      style="color:{{crimson}};text-decoration:none;font-weight:700"
                      >{{email}}</a
                    >
                  </div>
                  {{contactBlock}}
                </td>
              </tr>
            </table>
          </td>
          <td
            width="174"
            height="145"
            align="right"
            valign="middle"
            style="width:174px;height:145px;background:{{base}};padding:0 4px 4px 0;line-height:0"
          >
            <img
              src="{{assetBase}}/crest.gif"
              width="127"
              height="141"
              alt="McCarthy coat of arms"
              style="
                display: block;
                border: 0;
                width: 127px;
                height: 141px;
                margin: 0 0 0 auto;
              "
            />
          </td>
        </tr>
      </table>
    </td>
    <td
      width="26"
      valign="top"
      style="width: 26px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-right.gif"
        width="26"
        height="149"
        alt=""
        style="display: block; border: 0; width: 26px; height: 149px"
      />
    </td>
  </tr>
  <tr>
    <td
      width="26"
      height="25"
      style="width: 26px; height: 25px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-bl.gif"
        width="26"
        height="25"
        alt=""
        style="display: block; border: 0; width: 26px; height: 25px"
      />
    </td>
    <td
      width="548"
      height="25"
      style="width: 548px; height: 25px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-bottom.gif"
        width="548"
        height="25"
        alt=""
        style="display: block; border: 0; width: 548px; height: 25px"
      />
    </td>
    <td
      width="26"
      height="25"
      style="width: 26px; height: 25px; padding: 0; line-height: 0; font-size: 0"
    >
      <img
        src="{{assetBase}}/frame-br.gif"
        width="26"
        height="25"
        alt=""
        style="display: block; border: 0; width: 26px; height: 25px"
      />
    </td>
  </tr>
</table>
