<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;border-collapse:collapse;background-color:{{base}};border:2px solid {{border}};font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td width="220" style="width:220px;padding:0;vertical-align:middle;line-height:0;">
      <img src="{{assetBase}}/scene.gif" width="220" height="160" alt="McCor Labs red stag among glowing pines" style="display:block;width:220px;height:160px;border:0;">
    </td>
    <td width="104" style="width:104px;padding:0 16px;vertical-align:middle;line-height:0;">
      <img src="{{assetBase}}/photo-{{slug}}.jpg" width="72" height="90" alt="{{name}}" style="display:block;width:72px;height:90px;border:0;">
    </td>
    <td width="244" style="width:244px;padding:10px 12px 10px 0;vertical-align:middle;">
      <img src="{{assetBase}}/name-{{slug}}.png" width="240" height="44" alt="{{name}}" style="display:block;width:240px;height:44px;border:0;margin:0 0 2px -6px;">
      <div style="font-size:12px;line-height:17px;color:{{text}};font-weight:600;">{{title}}</div>
      <div style="font-size:12px;line-height:18px;"><a href="tel:{{phoneHref}}" style="color:{{muted}};text-decoration:none;">{{phone}}</a></div>
      <div style="font-size:12px;line-height:18px;"><a href="mailto:{{email}}" style="color:{{muted}};text-decoration:none;">{{email}}</a></div>
      <div style="font-size:12px;line-height:18px;color:{{muted}};"><a href="{{siteUrl}}" style="color:{{accent}};text-decoration:none;font-weight:600;">mccorlabs.com</a>&nbsp;&middot;&nbsp;<a href="{{bookingUrl}}" style="color:{{accent}};text-decoration:none;font-weight:600;">Book a call</a></div>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:6px;">
        <tr>
          {{socialCells}}
          <td style="padding:0;vertical-align:middle;font-size:9px;line-height:14px;color:{{borderStrong}};letter-spacing:0.6px;text-transform:uppercase;">{{slogan}}</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td colspan="3" style="padding:0;line-height:0;">
      <img src="{{assetBase}}/tartan.png" width="596" height="6" alt="" style="display:block;width:596px;height:6px;border:0;">
    </td>
  </tr>
</table>
