pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,css,json,md,yml,yaml}'
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx}'
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    terraform-fmt:
      glob: '*.tf'
      run: PATH=$HOME/.local/share/mise/shims:$PATH terraform fmt -recursive infra/
      stage_fixed: true
    terraform-validate:
      glob: '*.tf'
      run: PATH=$HOME/.local/share/mise/shims:$PATH; terraform -chdir=infra validate || exit 1; export TF_DATA_DIR="$(mktemp -d)"; terraform -chdir=infra/bootstrap init -backend=false -input=false >/dev/null && terraform -chdir=infra/bootstrap validate; rc=$?; rm -rf "$TF_DATA_DIR"; exit $rc
      fail_text: 'Terraform validate failed.'
    tflint:
      glob: '*.tf'
      run: PATH=$HOME/.local/share/mise/shims:$PATH; tflint --chdir=infra --init >/dev/null && tflint --chdir=infra && tflint --chdir=infra/bootstrap --config="$PWD/infra/.tflint.hcl"
      fail_text: 'tflint failed.'

pre-push:
  parallel: false
  commands:
    typecheck:
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm -F web exec tsc --noEmit
      fail_text: 'Type errors. Fix before pushing.'
    lint:
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm -F web lint
      fail_text: 'Lint errors. Fix before pushing.'
    format-check:
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm format:check
      fail_text: 'Formatting drift. Run: pnpm format'
    test:
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm -F web test:run
      fail_text: 'Unit/integration tests failing.'
    build:
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm build
      fail_text: 'Production build failed.'
    e2e:
      run: PATH=$HOME/.local/share/mise/shims:$PATH pnpm -F web test:e2e:smoke
      fail_text: 'Smoke tests failing.'
    terraform-fmt-check:
      run: PATH=$HOME/.local/share/mise/shims:$PATH terraform fmt -check -recursive infra/
      fail_text: 'Terraform formatting drift. Run: terraform fmt -recursive infra/'
    terraform-validate:
      run: PATH=$HOME/.local/share/mise/shims:$PATH; terraform -chdir=infra validate || exit 1; export TF_DATA_DIR="$(mktemp -d)"; terraform -chdir=infra/bootstrap init -backend=false -input=false >/dev/null && terraform -chdir=infra/bootstrap validate; rc=$?; rm -rf "$TF_DATA_DIR"; exit $rc
      fail_text: 'Terraform validate failed.'
    tflint:
      run: PATH=$HOME/.local/share/mise/shims:$PATH; tflint --chdir=infra --init >/dev/null && tflint --chdir=infra && tflint --chdir=infra/bootstrap --config="$PWD/infra/.tflint.hcl"
      fail_text: 'tflint failed.'
