<table
  id="sig"
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="500"
  style="width:500px;border-collapse:separate;background:{{text}};border:1px solid {{accent}};border-radius:6px"
>
  <tr>
    <td style="padding: 5px">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="488"
        style="width: 488px; border-collapse: collapse"
      >
        <tr>
          {{photoCell}}
          <td
            valign="top"
            style="width:{{textWidth}}px;padding:0 16px 0 {{textGap}}px;font-family:{{font}}"
          >
            <div
              style="font-size:18px;line-height:16px;font-weight:700;color:{{base}};letter-spacing:-0.2px;white-space:nowrap"
            >
              {{name}}
            </div>
            <div
              style="font-size:10px;line-height:12px;letter-spacing:1px;color:{{crimson}};text-transform:uppercase;font-weight:700;padding-top:4px;white-space:nowrap"
            >
              {{roleLine}}
            </div>
            {{specialtyRow}}
            <div
              style="border-top:1px solid {{rule}};font-size:1px;line-height:1px;height:1px;margin-top:7px"
            >
              &nbsp;
            </div>
            {{contactBlock}}
          </td>
          <td
            width="{{crestWidth}}"
            valign="top"
            style="width:{{crestWidth}}px;line-height:0"
          >
            <img
              src="{{assetBase}}/card-crest.png"
              width="{{crestWidth}}"
              height="{{crestHeight}}"
              alt="McCarthy coat of arms"
              style="display:block;border:0;width:{{crestWidth}}px;height:{{crestHeight}}px"
            />
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
