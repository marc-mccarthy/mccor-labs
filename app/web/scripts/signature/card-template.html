<table
  id="sig"
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="500"
  style="width:500px;border-collapse:separate;background:{{base}};border-radius:6px"
>
  <tr>
    <td style="padding: 4px">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="492"
        style="width:492px;border-collapse:separate;background:{{text}};border:1px solid {{accent}};border-radius:4px"
      >
        <tr>
          <td style="padding: 10px">
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
              width="470"
              style="width: 470px; border-collapse: collapse"
            >
              <tr>
                {{photoCell}}
                <td
                  valign="top"
                  style="width:230px;padding:0 16px 0 18px;font-family:{{font}}"
                >
                  <div
                    style="font-size:20px;line-height:19px;font-weight:700;color:{{base}};letter-spacing:-0.2px;white-space:nowrap"
                  >
                    {{name}}
                  </div>
                  <div
                    style="font-size:11px;line-height:13px;letter-spacing:1px;color:{{crimson}};text-transform:uppercase;font-weight:700;padding-top:2px;white-space:nowrap"
                  >
                    {{roleLine}}
                  </div>
                  {{specialtyRow}}
                  <div
                    style="border-top:1px solid {{rule}};font-size:1px;line-height:1px;height:1px;margin-top:5px"
                  >
                    &nbsp;
                  </div>
                  {{contactBlock}}
                </td>
                <td width="103" valign="top" style="width: 103px; line-height: 0">
                  <img
                    src="{{assetBase}}/card-crest.png"
                    width="103"
                    height="120"
                    alt="McCarthy coat of arms"
                    style="display: block; border: 0; width: 103px; height: 120px"
                  />
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
