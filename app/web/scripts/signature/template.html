<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" bgcolor="{{base}}" style="width:560px;max-width:560px;border-collapse:collapse;background-color:{{base}};font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td width="240" bgcolor="{{base}}" style="width:240px;padding:0;vertical-align:middle;line-height:0;">
      <img src="{{assetBase}}/scene.gif" width="240" height="103" alt="McCor Labs red stag among glowing pines" style="display:block;width:240px;height:103px;border:0;">
    </td>
    <td width="52" bgcolor="{{base}}" style="width:52px;padding:0 10px 0 0;vertical-align:middle;line-height:0;">
      <img src="{{assetBase}}/photo-{{slug}}.jpg" width="52" height="64" alt="{{name}}" style="display:block;width:52px;height:64px;border:0;">
    </td>
    <td bgcolor="{{base}}" style="padding:8px 12px 8px 0;vertical-align:middle;">
      <img src="{{assetBase}}/name-{{slug}}.png" width="170" height="30" alt="{{name}}" style="display:block;width:170px;height:30px;border:0;margin:0 0 1px -4px;">
      <div style="font-size:11px;line-height:15px;color:{{text}};font-weight:600;">{{title}}</div>
      <div style="font-size:11px;line-height:16px;color:{{muted}};">{{phoneCell}}<a href="mailto:{{email}}" style="color:{{muted}};text-decoration:none;">{{email}}</a></div>
      <div style="font-size:11px;line-height:16px;color:{{muted}};"><a href="{{siteUrl}}" style="color:{{link}};text-decoration:none;font-weight:600;">mccorlabs.com</a>&nbsp;&middot;&nbsp;<a href="{{bookingUrl}}" style="color:{{link}};text-decoration:none;font-weight:600;">Book a call</a>{{socialCells}}</div>
    </td>
  </tr>
</table>
